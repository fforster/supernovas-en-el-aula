name: Publicar en GitHub Pages

# Se publica al empujar a main, y también una vez al mes para refrescar las
# curvas de luz (las supernovas del catálogo son pasadas, así que cambian poco,
# pero ALeRCE puede añadir mediciones tardías).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, basta con publicar el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        # Sin --red: las pruebas que consultan ALeRCE no deben romper una
        # publicación si el broker está caído justo en ese momento.
        run: pytest -q

      - name: Construir el sitio
        run: python3 scripts/construir_estatico.py --salida sitio

      - name: Comprobar que el sitio no salió vacío
        run: |
          test -f sitio/index.html
          test -f sitio/api/catalogo-es.json
          n=$(python3 -c "import json;print(len(json.load(open('sitio/api/catalogo-es.json'))['objetos']))")
          echo "$n supernovas en el sitio"
          test "$n" -ge 10

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
